name: Sponsorship PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/nokia-sponsorship-map/**"
      - ".github/workflows/sponsorship-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build HTML and PDF
        env:
          CHROME_BIN: google-chrome
        run: python3 docs/nokia-sponsorship-map/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: nokia-sponsorship-map
          path: |
            docs/nokia-sponsorship-map.pdf
            docs/nokia-sponsorship-map.html

      - name: Commit the rebuilt files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/nokia-sponsorship-map.pdf docs/nokia-sponsorship-map.html
          if git diff --cached --quiet; then
            echo "PDF unchanged"
            exit 0
          fi
          git commit -m "Rebuild Nokia sponsorship PDF [skip ci]"
          git pull --rebase origin main
          git push origin main
